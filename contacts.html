<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Контакты | NIKA TRUCK</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


<section class="contacts-page">

    <div class="container">

        <h1>
            Контакты
        </h1>


        <p class="contacts-subtitle">

            Если у вас появились вопросы
            по изготовлению, срокам или заказу,
            свяжитесь с нами любым удобным способом.

        </p>


        <div class="contacts-grid">


            <!-- TELEGRAM -->

            <div class="contact-card">

                <img
                    src="images/telegram.png"
                    class="contact-icon"
                    alt="Telegram"
                >

                <p>
                    @olegebk
                </p>

                <a
                    href="https://t.me/olegebk"
                    target="_blank"
                >
                    Написать
                </a>

            </div>


            <!-- MAX -->

            <div class="contact-card">

                <img
                    src="images/max.png"
                    class="contact-icon"
                    alt="MAX"
                >

                <p>
                    @olegebk
                </p>

                <a href="#">
                    Написать
                </a>

            </div>


            <!-- EMAIL -->

            <div class="contact-card">

                <h2>
                    E-mail
                </h2>

                <p>
                    info@nika-truck.ru
                </p>

            </div>


        </div>


        <div class="back-home">

            <a
                href="index.html"
                class="btn-back"
            >
                ← Вернуться на главную
            </a>

        </div>

    </div>

</section>


</body>

</html>
